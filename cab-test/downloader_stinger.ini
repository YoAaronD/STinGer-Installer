; STinGer Installer - cab test drop-in (2026-11-20)
; Copy to /media/fat next to your existing downloader.ini. It ADDS these databases and changes nothing else:
; your downloader.ini, MiSTer.ini, cores and other games stay as they are.
;
; If your downloader.ini already has one of these sections (Ongo, kuze, Slop-Core, shmupfan), delete it from THIS file,
; so the same database isn't listed twice.

; Ongo: cores not in Update All (Seibu SPI, Taito, Seta...). Arcade only, so no extra console cores land.
[OngoGablogian/MiSTer_Ongo]
db_url = https://raw.githubusercontent.com/OngoGablogian/MiSTer_Ongo/db/db.json.zip
filter = arcade

; kuze: NMK16 family (Thunder Dragon 1/2, GunNail, Rapid Hero...), Jaleco Mega System 1, Namco System 2.
[kuzearcade/kuzecores]
db_url = https://raw.githubusercontent.com/kuzearcade/kuzecores/db/db.json.zip

; Slop-Core (TheJesusFish): Batsugun, Dogyuun, V-Five, FixEight, Ghox. Cores only; STinGer brings the game entries.
[TheJesusFish/Slop-Core]
db_url = https://raw.githubusercontent.com/TheJesusFish/Slop-Core/db/db.json.zip
filter = arcaderbfsonly

; shmupfan: Taito G-NET (Psyvariar, Shikigami no Shiro...), Dooyong, DEC8, Tecmo 16, 1945k III.
[shmupfan]
db_url = https://raw.githubusercontent.com/shmupfan/Distribution/main/db.json

; STinGer: _Arcade/_Vertical Arcade. Default leaves out the CV1000 games (Raki's core is Patreon-only).
; Have Raki's core? Uncomment the next line to include them, and put the core (ikacore_CV1k...rbf) in _Arcade/cores.
[YoAaronD/STinGer-Installer]
db_url = https://raw.githubusercontent.com/YoAaronD/STinGer-Installer/db/db.json.zip
; filter = arcade
