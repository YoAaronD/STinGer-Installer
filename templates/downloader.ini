; STinGer Installer - downloader.ini for a CCW tate CRT cabinet
; Every database the STinGer games need, filtered for a vertical arcade-only setup.
;
; Keep [mister] free of positive filter terms: Jotego's and Coin-Op's databases inherit it,
; and a positive term there would filter almost everything out of them.

[mister]

; MiSTer's own cores. Arcade only: consoles and computers need scaler rotation on a rotated CRT.
[distribution_mister]
db_url = https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/db.json.zip
filter = arcade

; Jotego (Capcom, Toaplan, Konami, Namco...). Arcade-only already.
[jtcores]
db_url = https://raw.githubusercontent.com/jotego/jtcores_mister/main/jtbindb.json.zip

; Coin-Op Collection (Raizing, Toaplan 2, NMK...). Arcade-only already.
[Coin-OpCollection/Distribution-MiSTerFPGA]
db_url = https://raw.githubusercontent.com/Coin-OpCollection/Distribution-MiSTerFPGA/db/db.json.zip

; Ongo: lots of cores not in Update All (Seibu SPI, Taito, Seta, CV1000 MRAs...). Also has consoles, so arcade only.
[OngoGablogian/MiSTer_Ongo]
db_url = https://raw.githubusercontent.com/OngoGablogian/MiSTer_Ongo/db/db.json.zip
filter = arcade

; kuze: NMK16 family (Thunder Dragon 1/2, GunNail, Macross, Rapid Hero...), Jaleco Mega System 1, Namco System 2.
[kuzearcade/kuzecores]
db_url = https://raw.githubusercontent.com/kuzearcade/kuzecores/db/db.json.zip

; shmupfan: Taito G-NET (Psyvariar, Shikigami no Shiro, XII Stag...), Dooyong, DEC8, Tecmo 16, 1945k III.
[shmupfan]
db_url = https://raw.githubusercontent.com/shmupfan/Distribution/main/db.json

; STinGer: the _STG folders. Default filter is !cv1000 (Raki's CV1000 core is Patreon-only).
; If you have Raki's core, opt in with a filter that leaves cv1000 alone, e.g. "filter = !stghacks".
[YoAaronD/STinGer-Installer]
db_url = https://raw.githubusercontent.com/YoAaronD/STinGer-Installer/db/db.json.zip
