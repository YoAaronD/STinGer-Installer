; STinGer Installer - downloader.ini for a CCW tate CRT cabinet (full install)
; The arcade menu is STinGer's alone: the other databases deliver cores only, and STinGer's
; database puts Core STGs, Other Shooting Games and Other Vertical Games straight into _Arcade.
;
; How the filters fit together:
; - [mister] skips stock game lists ("!mra"). A database with no filter line of its own falls back to it.
;   That matters for Coin-Op Collection: Update All rewrites (or removes) Coin-Op's filter line on
;   every run, and every value it writes starts with [MiSTer], so Coin-Op still brings only its cores.
;   Anything else you switch on in Update All (arcade ROMs, BIOS, names files...) installs normally.
; - The core databases below have explicit "arcaderbfsonly" lines, which override [mister]:
;   arcade cores only, none of their game lists or console/computer cores.

[mister]
filter = !mra

; MiSTer's own cores: arcade cores only, plus the essentials (MiSTer, menu, Linux, scripts)
; and the video/audio filters and fonts the inis can point at.
[distribution_mister]
db_url = https://raw.githubusercontent.com/MiSTer-devel/Distribution_MiSTer/main/db.json.zip
filter = arcaderbfsonly all_filters font

; Jotego (Capcom, Toaplan, Konami, Namco...). Cores only.
; Update All adds or removes "!jtbeta" here to match its beta-cores setting; that's fine.
[jtcores]
db_url = https://raw.githubusercontent.com/jotego/jtcores_mister/main/jtbindb.json.zip
filter = arcaderbfsonly

; Coin-Op Collection (Raizing, Toaplan 2, NMK...). Cores only, through [mister] (see above): no filter line here on purpose.
[Coin-OpCollection/Distribution-MiSTerFPGA]
db_url = https://raw.githubusercontent.com/Coin-OpCollection/Distribution-MiSTerFPGA/db/db.json.zip

; Ongo: cores not in Update All (Seibu SPI, Taito, Seta, NMK...). Cores only: the ROMs STinGer's games
; need (Ongo's own, and the ones it hosts for Slop-Core, jlrh, kuze and shmupfan) come through STinGer-ROMs below.
[OngoGablogian/MiSTer_Ongo]
db_url = https://raw.githubusercontent.com/OngoGablogian/MiSTer_Ongo/db/db.json.zip
filter = arcaderbfsonly

; kuze: NMK16 family (Thunder Dragon 1/2, GunNail, Macross, Rapid Hero...), Jaleco Mega System 1, Namco System 2. Cores only.
[kuzearcade/kuzecores]
db_url = https://raw.githubusercontent.com/kuzearcade/kuzecores/db/db.json.zip
filter = arcaderbfsonly

; shmupfan (Taito G-NET, Dooyong, DEC8, Tecmo 16, 1945k III): no section needed.
; Its database can't be trimmed to cores, so STinGer's database delivers shmupfan's cores itself.

; Update All (theypsilon): installs itself through this section on the first update run, then lives in Scripts.
; Keep Distribution, JTCORES and Coin-Op Collection enabled in its settings: STinGer games need their cores.
[update_all_mister]
db_url = https://raw.githubusercontent.com/theypsilon/Update_All_MiSTer/db/update_all_db.json

; 240p Test Suite (Artemio Urbina's native core, packaged by ajgowans): patterns for setting up the CRT.
; Only the core itself; the console versions of the suite need console cores this setup leaves out.
; It shows up on the main menu under Utility.
[ajgowans/240p]
db_url = https://raw.githubusercontent.com/ajgowans/240p/db/db.json.zip
filter = 240psuite

; STinGer: the menu, plus shmupfan's cores.
; CV1000 games are left out: Raki's core is Patreon-only.
; Have Raki's core? Change the filter line to "filter = all" to include them, and put the core
; (ikacore_CV1k...rbf) in _Arcade/cores.
; Don't delete the filter line: without one, this section falls back to [mister]'s "!mra" and the
; whole STinGer menu would be skipped.
[YoAaronD/STinGer-Installer]
db_url = https://raw.githubusercontent.com/YoAaronD/STinGer-Installer/db/full.json.zip
filter = !cv1000

; STinGer-ROMs: exactly the ROM zips STinGer's games use (about 1.3 GB; 2.2 GB with CV1000), pointing at
; the same archive.org files Update All's Arcade ROMs and Ongo use. A separate database, so it can be
; dropped without touching the menu. Bringing your own ROMs? Delete this section.
; Leave Update All's Arcade ROMs switch off: it would fetch ~4.5 GB more, mostly for games this menu doesn't show.
; Have Raki's CV1000 core? Change the filter line to "filter = all" here too, for the CV1000 ROMs.
[YoAaronD/STinGer-ROMs]
db_url = https://raw.githubusercontent.com/YoAaronD/STinGer-ROMs/main/db.json.zip
filter = !cv1000
