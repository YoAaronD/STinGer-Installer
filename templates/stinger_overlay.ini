; STinGer's additions to a flavor's base MiSTer.ini.
; Keys here replace the base's value in the same section; new sections are appended.
; Keep this minimal: the base ini (MiSTerAddons' for MiSTercades, stock for others) owns the hardware settings.

[MiSTer]
osd_rotate=2           ; CCW-rotated monitor: rotate the menu left (-90°)
menu_start_dir=_Arcade ; open the core list in Arcade after boot (proposed upstream; MiSTer ignores it until then)

[Menu]
video_mode=320,240,60  ; MiSTerAddons' recommended menu block: scripts, the updater and wallpaper
vga_scaler=1           ; show on the CRT at the main menu
